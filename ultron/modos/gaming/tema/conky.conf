conky.config = {
  alignment = 'top_right', gap_x = 42, gap_y = 65, minimum_width = 330,
  own_window = true, own_window_type = 'desktop', own_window_transparent = true,
  own_window_argb_visual = true, double_buffer = true, update_interval = 1,
  use_xft = true, font = 'Rajdhani:size=14', default_color = '#E6E6FF',
  color1 = '#FF00E6', color2 = '#00F0FF', color3 = '#39FF14',
};
conky.text = [[
${color2}${font Orbitron:size=34}${time %H:%M}${font}${color}
${color1}${execi 3 @@hud@@}${color} ${hr 2}
@@anillos@@
${color3}HP  CPU ${cpu}%   ${cpubar 6,120}
${color2}MP  RAM ${memperc}%   ${membar 6,120}
${color1}GPU ${execi 3 @@hud@@ gpu}   ${execbar 6,120 @@hud@@ gpu}${color}
Temperatura ${hwmon temp 1} °C
Red ↓ ${downspeedf @@red@@}  ↑ ${upspeedf @@red@@} KiB/s
]];

