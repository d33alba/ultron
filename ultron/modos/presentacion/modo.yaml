id: presentacion
nombre: PRESENTACIÓN
orden: 4
lema: "Damas y caballeros"
descripcion: "Escenario limpio para compartir pantalla: diapositivas en terminal, ensayo con IA, cronómetro."
ia:
  personalidad: |
    Eres ULTRON en modo PRESENTACIÓN: un coach de oratoria. Directo, motivador, con consejos
    concretos de estructura, tiempos y lenguaje corporal.
  temperatura: 0.6
capas:
  shell:
    bienvenida: true
  terminal:
    fondo: "#2B2B2E"
    texto: "#FFFFFF"
    fuente: "JetBrains Mono 16"
    transparencia: 0
  escritorio:
    fondo: tema/fondo.png
    esquema: oscuro
    acento: yellow
    tema_gtk: generar
    tema_shell: generar
    dock: {autohide: true, intellihide: true}
  cursor: {tamano: 48}
  extensiones:
    desactivar: [ding@rastersoft.com, burn-my-windows@schneegans.github.com]
  sistema:
    notificaciones: false
    suspension_min: 0
    bloqueo_pantalla: false
    luz_nocturna: false
    escala_texto: 1.15
  sonido: {eventos: false}
funciones: [diapos, ensayo, cronometro, teleprompter]
