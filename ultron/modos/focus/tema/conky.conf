conky.config = {
  alignment = 'top_right', gap_x = 60, gap_y = 90, minimum_width = 320,
  own_window = true, own_window_type = 'desktop', own_window_transparent = true,
  own_window_argb_visual = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true, update_interval = 1, use_xft = true,
  font = '@@fuente@@:light:size=11', default_color = '@@texto@@',
  color1 = '@@acento@@', color2 = '@@apagado@@',
  draw_shades = false, draw_outline = false, draw_borders = false,
};
conky.text = [[
${alignr}${font @@fuente@@:light:size=54}${time %H:%M}${font}
${alignr}${color2}${time %A, %d de %B}${color}

${alignr}${color1}${execi 2 ultron prompt-extra}${color}
${alignr}${color2}${execi 60 ultron plan proximo}${color}
]];
