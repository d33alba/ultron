id: focus
nombre: FOCUS
orden: 2
lema: "Modo túnel: solo tú y tus apuntes"
descripcion: "Estudio: estética limpia, resúmenes y flashcards de PDF, exámenes, plan, pomodoro."
ia:
  personalidad: |
    Eres ULTRON en modo FOCUS, un tutor paciente y claro. Explicas paso a paso con ejemplos,
    compruebas que se ha entendido con una pregunta y animas sin exagerar.
    Respuestas breves y ordenadas.
  temperatura: 0.4
capas:
  lanzadores: {}
  shell:
    alias:
      estudiar: "ultron pomodoro"
      repaso: "ultron repasar"
    bienvenida: true
  fuentes: {}
  terminal:
    fondo: "#1E1F22"
    texto: "#C8C8C8"
    fuente: "JetBrains Mono 12"
    transparencia: 0
    cursor: ibeam
  escritorio:
    fondo: tema/fondo.png
    esquema: oscuro
    acento: slate
    animaciones: false
    tema_gtk: generar
    tema_shell: generar
    dock: {dock-position: LEFT, extend-height: false, dock-fixed: false, autohide: true,
           intellihide: true, dash-max-icon-size: 32, show-trash: false, show-mounts: false,
           transparency-mode: FIXED, background-opacity: 0.0, custom-background-color: true,
           background-color: "#1E1F22"}
  iconos:
    monocromo: true
    tinte: {objetivo: "#8FBC8F"}
  cursor: {tamano: 24}
  extensiones:
    activar: [user-theme@gnome-shell-extensions.gcampax.github.com,
              just-perfection-desktop@just-perfection]
    desactivar: [burn-my-windows@schneegans.github.com, blur-my-shell@aunetx,
                 compiz-windows-effect@hermes83.github.com, desktop-cube@schneegans.github.com,
                 openbar@neuromorph, space-bar@luchrioh]
    ajustes:
      /org/gnome/shell/extensions/just-perfection/activities-button: false
      /org/gnome/shell/extensions/just-perfection/app-menu: false
      /org/gnome/shell/extensions/just-perfection/accessibility-menu: false
      /org/gnome/shell/extensions/just-perfection/keyboard-layout: false
      /org/gnome/shell/extensions/just-perfection/world-clock: false
      /org/gnome/shell/extensions/just-perfection/weather: false
      /org/gnome/shell/extensions/just-perfection/events-button: false
      /org/gnome/shell/extensions/just-perfection/workspace-popup: false
      /org/gnome/shell/extensions/just-perfection/window-demands-attention-focus: true
  sistema:
    notificaciones: false
    luz_nocturna: true
    escala_texto: 1.05
    bloquear: [youtube.com, www.youtube.com, m.youtube.com, instagram.com, www.instagram.com,
               tiktok.com, www.tiktok.com, twitter.com, x.com, www.x.com, reddit.com,
               www.reddit.com, twitch.tv, www.twitch.tv, netflix.com, www.netflix.com,
               facebook.com, www.facebook.com]
  musica: {archivo: tema/ambiente.mp3, ambiente: lluvia, volumen: 35, bucle: true,
           fundido_entrada_s: 4}
  sonido: {eventos: false}
  widgets: {fuente: "Inter", plantilla: tema/conky.conf}
dependencias:
  apt: [poppler-utils, pandoc, tesseract-ocr, tesseract-ocr-spa]
  fuentes: [Inter]
funciones: [resumen, flashcards, repasar, examen, pregunta, esquema, explica, plan, pomodoro,
            stats, ordenar]
