id: netanyahu
nombre: NETANYAHU
orden: 1
lema: "Acceso concedido"
descripcion: "Hacker israelí: todo el sistema en azul y blanco, OSINT, hacking ético y el Ojo de Dios."
ia:
  personalidad: |
    Eres ULTRON en modo NETANYAHU: analista jefe de una unidad de ciberinteligencia israelí.
    Hablas como en un informe de operaciones: frases cortas, precisas y técnicas. Usas términos
    como OBJETIVO, VECTOR y SUPERFICIE. Enseñas hacking ético y OSINT siempre dentro de la ley:
    si te piden atacar a terceros sin permiso, te niegas y propones una alternativa legal
    (un laboratorio, un CTF).
  temperatura: 0.6
capas:
  lanzadores: {}
  shell:
    alias:
      op: "ultron osint"
      objetivo: "ultron osint dominio"
    bienvenida: true
  fuentes: {}
  terminal:
    fondo: "#0A1A3F"
    texto: "#FFFFFF"
    fuente: "JetBrains Mono 12"
    transparencia: 8
    cursor: block
    cursor_color: "#FFFFFF"
    paleta: ["#071028", "#E63946", "#497FE2", "#A5C5FF", "#0038B8", "#665DDA",
             "#6EA8FE", "#DDEAFF", "#536484", "#FF7080", "#6EA8FE", "#C9DEFF",
             "#4B80FF", "#A6A1FF", "#9BCFFF", "#FFFFFF"]
  escritorio:
    fondo: tema/fondo.png
    fondo_bloqueo: tema/bloqueo.png
    esquema: oscuro
    acento: blue
    tema_gtk: generar
    tema_shell: generar
    dock: {dock-position: BOTTOM, extend-height: false, transparency-mode: FIXED,
           background-opacity: 0.85, custom-background-color: true,
           background-color: "#0038B8", dash-max-icon-size: 48, dock-fixed: true,
           show-trash: false, show-mounts: false, running-indicator-style: DOTS}
  iconos:
    tinte: {objetivo: "#0038B8", intensidad: 0.85}
    emblema: tema/emblema.png
    emblema_en: [places]
    personalizados: tema/iconos
  cursor: {generar: true, color: "#0038B8", tamano: 32}
  extensiones:
    activar: [user-theme@gnome-shell-extensions.gcampax.github.com, blur-my-shell@aunetx,
              burn-my-windows@schneegans.github.com, openbar@neuromorph]
    ajustes:
      /org/gnome/shell/extensions/blur-my-shell/panel/blur: "true"
      /org/gnome/shell/extensions/blur-my-shell/panel/static-blur: "false"
      /org/gnome/shell/extensions/blur-my-shell/panel/sigma: 12
      /org/gnome/shell/extensions/blur-my-shell/panel/brightness: 0.82
      /org/gnome/shell/extensions/openbar/bartype: "'Islands'"
      /org/gnome/shell/extensions/openbar/dark-bgcolor: "['0.0', '0.22', '0.72']"
      /org/gnome/shell/extensions/openbar/dark-bcolor: "['1.0', '1.0', '1.0']"
      /org/gnome/shell/extensions/openbar/bwidth: 1.5
    perfil_tv: true
  sonido: {eventos: true}
  widgets: {fuente: "JetBrains Mono"}
  musica: {archivo: tema/musica.mp3, bucle: true, volumen: 70, fundido_entrada_s: 2}
  arranque: {logo: tema/arranque/logo.png}
dependencias:
  apt: [nmap, whois, dnsutils, whatweb, lynis, libimage-exiftool-perl, binwalk, steghide, john,
        hashid, git, traceroute, nodejs, npm]
  extensiones: [blur-my-shell@aunetx, burn-my-windows@schneegans.github.com]
funciones: [osint, radar, auditar, cve, filtrado, web, ctf, hackia, ojo]
recursos_opcionales:
  - {ruta: tema/fondo.png, descripcion: "Fondo de Netanyahu (GPT Images)"}
  - {ruta: tema/musica.mp3, descripcion: "Música de flauta: ultron musica importar <url>"}
  - {ruta: tema/iconos, descripcion: "Iconos personalizados de aplicaciones"}
