id = "netanyahu"
nombre = "NETANYAHU"
bordes = "DOUBLE"
entrada = "escritura"
prompt = "{c:primario}✡ {c:secundario}{usuario}{c:primario}@{c:secundario}netanyahu {c:primario}▸ {c:apagado}{dir} {c:acento}{extra}{c:primario} ❯{reset} "
spinner = ["◜", "◝", "◞", "◟"]

# Las líneas que acaban en barra invertida no llevan [/] (la barra escaparía la etiqueta).
banner = '''
[secundario]          /\
[secundario]     ____/__\____     [bold primario]█ █ █   ▀█▀ █▀█ █▀█ █▄ █[/]
[secundario]     \  /    \  /     [bold primario]█▄█ █▄▄  █  █▀▄ █▄█ █ ▀█[/]
[secundario]      \/      \/
[secundario]      /\      /\      [bold secundario]M O D O   N E T A N Y A H U[/]
[secundario]     /__\____/__\     [acento]שלום · ACCESO CONCEDIDO[/]
[secundario]         \  /
[secundario]          \/          [apagado]CLASIFICACIÓN: ALTO SECRETO · SESIÓN 0x7F3A[/]
'''
banner_compacto = '''
[bold primario]✡ ULTRON[/] [secundario]// NETANYAHU[/] [apagado]· acceso concedido[/]
'''

[paleta]
