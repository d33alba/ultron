conky.config = {
    alignment = 'top_right',
    gap_x = 28,
    gap_y = 72,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    double_buffer = true,
    update_interval = 2,
    use_xft = true,
    font = '@@fuente@@:size=10',
    default_color = 'FFFFFF',
    color1 = '6EA8FE',
};

conky.text = [[
${color1}RADAR STATUS ${hr 1}${color}
${color1}Jerusalén${color} ${tztime Asia/Jerusalem %H:%M}  ${color1}Local${color} ${time %H:%M}
${execi 300 @@radar_publica@@}
${execi 10 @@radar_local@@}
${color1}CPU${color} ${cpu}% ${cpubar 6,120}
${color1}RAM${color} ${memperc}% ${membar 6,120}
]];
