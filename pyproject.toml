[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ultron"
dynamic = ["version"]
description = "CLI para Ubuntu que transforma el sistema operativo entero según el modo, con IA modular."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "d33alba" }]
keywords = ["cli", "ubuntu", "gnome", "osint", "ia", "temas", "productividad"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Natural Language :: Spanish",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "textual>=0.60",
  "pyyaml>=6",
  "httpx>=0.27",
  "pypdf>=4",
  "genanki>=0.13",
  "pillow>=10",
  "tomli-w>=1.0",
  "tomli>=2; python_version < '3.11'",
  "dnspython>=2.6",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.urls]
Repositorio = "https://github.com/d33alba/ultron"
"Documentación" = "https://github.com/d33alba/ultron/tree/main/docs"
Incidencias = "https://github.com/d33alba/ultron/issues"

[project.scripts]
ultron = "ultron.cli:main"

[tool.hatch.version]
path = "ultron/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ultron"]

[tool.hatch.build.targets.wheel.force-include]
"extension" = "ultron/_extension"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# plantillas HTML/CSS dentro de cadenas
"ultron/modos/presentacion/diapos.py" = ["E501"]
"ultron/modos/presentacion/funciones/__init__.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
